name: Android verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Unit tests, Java static checks and translations
        shell: pwsh
        run: ./tools/test.ps1
      - name: Build, run Android lint and verify APK
        shell: pwsh
        run: ./tools/build.ps1 -Lint

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 28
            resolution: 1280x720
          - api-level: 33
            resolution: 1920x1080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Build test APKs for this runner
        shell: pwsh
        run: ./tools/build.ps1
      - name: Free emulator storage on the hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          # Instrumentation uses the emulator and SDK platform tools only.
          sudo rm -rf -- /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake /usr/share/swift
          df -h "$HOME"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -feature -Vulkan
          script: |
            adb -s emulator-5554 shell wm size ${{ matrix.resolution }}
            adb -s emulator-5554 shell wm density 160
            pwsh -NoProfile -File tools/test-ui.ps1 -Serial emulator-5554
